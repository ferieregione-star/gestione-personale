name: Verifica configurazione notifiche

on:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla presenza Secrets
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo 'Manca GCP_WORKLOAD_IDENTITY_PROVIDER'; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo 'Manca GCP_SERVICE_ACCOUNT'; exit 1; }
          echo 'Secrets Google Cloud presenti.'
